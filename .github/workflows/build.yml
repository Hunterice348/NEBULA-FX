name: NEBULA FX Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Collect Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "package/VST3"
          $vst3Path = "build/NEBULA_FX_artefacts/Release/VST3/NEBULA FX.vst3"
          if (Test-Path $vst3Path) {
            Copy-Item -Path $vst3Path -Destination "package/VST3/" -Recurse -Force
            Write-Host "Successfully copied VST3"
          } else {
            Write-Host "VST3 not found. Searching for any .vst3 files:"
            Get-ChildItem -Path "build" -Recurse -Filter "*.vst3"
            throw "VST3 build artifact not found!"
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NEBULA-FX-Windows-VST3
          path: package/
          retention-days: 14
